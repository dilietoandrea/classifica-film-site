    .search:focus {

      border-color: var(--accent);
    }
    .counter { color: var(--muted); font-size: 14px; }
    .nav-link {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .nav-link:hover, .nav-link:focus {
      border-color: var(--accent);
      outline: 2px solid rgba(124, 58, 237, 0.18);
    }
    .nav-link[aria-current="page"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .table-wrap { overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(24, 32, 42, 0.08); }
    table { width: 100%; min-width: 980px; border-collapse: separate; border-spacing: 0; font-size: 14px; }
    th, td { padding: 10px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; background: var(--head); color: #27124d; text-align: center; }

    th[aria-sort] {
      padding: 0;
    }
    .sort-button {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }
    .sort-button:hover {
      color: var(--accent);
    }
    .sort-button:focus-visible {
      outline: 2px solid rgba(24, 32, 42, 0.18);
      outline-offset: -2px;
    }
    .sort-label {
      min-width: 0;
    }
    .sort-indicator {
      flex: 0 0 auto;
      width: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }
    th[aria-sort="none"] .sort-indicator::before {
      content: "\2195";
    }
    th[aria-sort="ascending"] .sort-indicator::before {
      content: "\25B2";
      color: var(--accent);
    }
    th[aria-sort="descending"] .sort-indicator::before {
      content: "\25BC";
      color: var(--accent);
    }
    th[aria-sort="ascending"] .sort-button,
    th[aria-sort="descending"] .sort-button {
      color: var(--accent);
    }

    td:nth-child(1), td:nth-child(3), td:nth-child(4), td:nth-child(8) { text-align: center; white-space: nowrap; }
    td:nth-child(2) { min-width: 260px; font-weight: 700; }
    @media (max-width: 700px) {
      main { width: calc(100% - 20px); margin-top: 14px; }
      h1 { font-size: 22px; }
      .toolbar { align-items: stretch; }
      .toolbar-tools {
        margin-left: 0;
        justify-content: stretch;
      }
      .search { width: 100%; }
      table { font-size: 13px; }
      th, td { padding: 8px 10px; }
    }
  </style>

<body>
  <main>
    <h1>Top 20 Italia · week-end del 21 agosto 2026</h1>
    <p class="meta"></p>
    <p class="meta">Generata il 29/08/2026 15:46 - 0 film</p>
    <div class="toolbar">

      </div>
      <div class="toolbar-tools">
        <span class="counter" id="table-counter">0 film</span>
        <input class="search" id="table-search" type="search" placeholder="Cerca nel box office" autocomplete="off">
      </div>
    </div>
    <div class="table-wrap">
      <table id="boxoffice-table">
        <thead><tr><th scope="col" aria-sort="none"><button class="sort-button" type="button" data-column="0" data-sort-type="number"><span class="sort-label">POSIZIONE</span><span class="sort-indicator" aria-hidden="true"></span></button></th><th scope="col" aria-sort="none"><button class="sort-button" type="button" data-column="1" data-sort-type="text"><span class="sort-label">TITOLO</span><span class="sort-indicator" aria-hidden="true"></span></button></th><th scope="col" aria-sort="none"><button class="sort-button" type="button" data-column="2" data-sort-type="number"><span class="sort-label">INCASSO WEEKEND</span><span class="sort-indicator" aria-hidden="true"></span></button></th><th scope="col" aria-sort="none"><button class="sort-button" type="button" data-column="3" data-sort-type="number"><span class="sort-label">INCASSO TOTALE</span><span class="sort-indicator" aria-hidden="true"></span></button></th><th scope="col" aria-sort="none"><button class="sort-button" type="button" data-column="4" data-sort-type="text"><span class="sort-label">REGIA</span><span class="sort-indicator" aria-hidden="true"></span></button></th><th scope="col" aria-sort="none"><button class="sort-button" type="button" data-column="5" data-sort-type="text"><span class="sort-label">GENERE</span><span class="sort-indicator" aria-hidden="true"></span></button></th><th scope="col" aria-sort="none"><button class="sort-button" type="button" data-column="6" data-sort-type="text"><span class="sort-label">PAESI</span><span class="sort-indicator" aria-hidden="true"></span></button></th><th scope="col" aria-sort="none"><button class="sort-button" type="button" data-column="7" data-sort-type="number"><span class="sort-label">ANNO</span><span class="sort-indicator" aria-hidden="true"></span></button></th><th scope="col" aria-sort="none"><button class="sort-button" type="button" data-column="8" data-sort-type="text"><span class="sort-label">RELAZIONE</span><span class="sort-indicator" aria-hidden="true"></span></button></th><th scope="col" aria-sort="none"><button class="sort-button" type="button" data-column="9" data-sort-type="text"><span class="sort-label">URL</span><span class="sort-indicator" aria-hidden="true"></span></button></th></tr></thead>
        <tbody>

        </tbody>
      </table>
    </div>
    <p class="meta version-info" id="version-info">Generato con cfr <span id="site-version">3.10.62</span></p>
  </main>
  <script>

    const table = document.getElementById("boxoffice-table");
    const searchInput = document.getElementById("table-search");
    const counter = document.getElementById("table-counter");
    const tbody = table.tBodies[0];
    const headerCells = Array.from(table.querySelectorAll("thead th[aria-sort]"));
    const sortButtons = Array.from(table.querySelectorAll("thead .sort-button"));
    let sortState = { column: null, direction: "ascending" };

    function allRows() {
      return Array.from(tbody.rows);
    }

    function rowCountText(visible) {
      return `${visible} di ${tbody.rows.length} film`;
    }

    function updateCounter(visible) {
      counter.textContent = rowCountText(visible);
    }

    function updateFilter() {
      const query = searchInput.value.trim().toLocaleLowerCase("it-IT");
      let visible = 0;
      for (const row of allRows()) {
        const matches = !query || row.textContent.toLocaleLowerCase("it-IT").includes(query);
        row.hidden = !matches;
        if (matches) visible += 1;
      }
      updateCounter(visible);
    }

    function cellSortValue(row, columnIndex) {
      const cell = row.cells[columnIndex];
      if (!cell) {
        return "";
      }
      return cell.dataset.sortValue ?? cell.textContent.trim();
    }

    function compareRows(rowA, rowB, columnIndex, sortType) {
      const valueA = cellSortValue(rowA, columnIndex);
      const valueB = cellSortValue(rowB, columnIndex);
      if (sortType === "number") {
        const numberA = Number(valueA);
        const numberB = Number(valueB);
        const hasNumberA = Number.isFinite(numberA);
        const hasNumberB = Number.isFinite(numberB);
        if (hasNumberA && hasNumberB && numberA !== numberB) {
          return numberA - numberB;
        }
        if (hasNumberA !== hasNumberB) {
          return hasNumberA ? -1 : 1;
        }
      }
      return String(valueA).localeCompare(String(valueB), "it-IT", {
        numeric: true,
        sensitivity: "base",
      });
    }

    function updateSortState(columnIndex, direction) {
      for (const cell of headerCells) {
        cell.setAttribute("aria-sort", "none");
      }
      headerCells[columnIndex].setAttribute("aria-sort", direction);
      for (const button of sortButtons) {
        button.setAttribute("aria-pressed", "false");
      }
      sortButtons[columnIndex].setAttribute("aria-pressed", "true");
    }

    function sortBy(columnIndex, sortType) {
      const nextDirection =
        sortState.column === columnIndex && sortState.direction === "ascending"
          ? "descending"
          : "ascending";
      sortState = { column: columnIndex, direction: nextDirection };
      const rows = allRows();
      rows.sort((rowA, rowB) => {
        const result = compareRows(rowA, rowB, columnIndex, sortType);
        return nextDirection === "ascending" ? result : -result;
      });
      tbody.append(...rows);
      updateSortState(columnIndex, nextDirection);
      updateFilter();
    }

    for (const button of sortButtons) {
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => {
        sortBy(Number(button.dataset.column), button.dataset.sortType);
      });
    }

    searchInput.addEventListener("input", updateFilter);
    searchInput.addEventListener("search", updateFilter);
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        updateFilter();
      }
    });

    updateFilter();

  </script>
